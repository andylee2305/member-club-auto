name: Check OpenAI model access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai>=2.0,<3'
      - name: List model IDs available to this API key
        run: python scripts/check_openai_models.py
