name: Daily Instagram photo

on:
  schedule:
    # 20:00 Hong Kong, preparing tomorrow's 11:00 post.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Hong Kong publication date (YYYY-MM-DD); blank means tomorrow'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-instagram
  cancel-in-progress: false

jobs:
  schedule-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      TARGET_DATE: ${{ inputs.target_date }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Buffer channel
        run: python scripts/daily_post.py preflight --date "$TARGET_DATE"
      - name: Generate caption and photo
        run: python scripts/daily_post.py generate --date "$TARGET_DATE"
      - name: Publish photo to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Instagram photo for ${TARGET_DATE:-tomorrow}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Schedule in Buffer for 11:00 Hong Kong
        run: python scripts/daily_post.py schedule --date "$TARGET_DATE"
      - name: Save Buffer receipt
        if: success()
        run: |
          git add posts
          if ! git diff --cached --quiet; then
            git commit -m "Record Buffer schedule for ${TARGET_DATE:-tomorrow}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
